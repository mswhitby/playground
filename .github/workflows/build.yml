name: Build the Playground
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: playground
      - uses: actions/checkout@v4
        with:
          repository: mswhitby/game-programming
          path: game-programming
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test course contracts and quiz scoring
        working-directory: playground
        run: node --test tests/*.test.mjs
      - name: Build one shared website
        working-directory: playground
        run: python scripts/build.py --game-source ../game-programming
      - uses: actions/upload-artifact@v4
        with:
          name: playground-site
          path: playground/dist
          include-hidden-files: true
