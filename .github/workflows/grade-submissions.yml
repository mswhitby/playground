name: Grade Playground hand-ins
on:
  push:
    branches: [main]
    paths: ['grading/**', '.github/workflows/grade-submissions.yml']
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: playground-grading
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check grader configuration
        id: config
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHALLENGE_TOKEN: ${{ secrets.CHALLENGES_READ_TOKEN }}
        run: |
          if [ -n "$KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            if [ -n "$CHALLENGE_TOKEN" ]; then echo 'shared_ready=true' >> "$GITHUB_OUTPUT"; fi
          else
            echo 'Grading is not activated. Complete docs/grading-setup.md.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
        with:
          repository: mswhitby/computer-science-1
          ref: 68b8ce79ee03c199cd1efb47ad545b92694d9e28
          path: curriculum
          persist-credentials: false
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
        with:
          repository: mswhitby/python_problems_20261026
          ref: 75f2d50ab64bd9552aeb2008f83ad5b456c63394
          path: challenge-grader
          persist-credentials: false
      - name: Checkout private shared challenge grading cases
        uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true' && steps.config.outputs.shared_ready == 'true'
        with:
          repository: mswhitby/challenges
          ref: 69ce52fc851a91545075724c9b0290db7bf6fef6
          path: challenge-bank
          token: ${{ secrets.CHALLENGES_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Prepare reviewed grading inputs
        if: steps.config.outputs.ready == 'true'
        run: |
          node scripts/package-python.mjs curriculum grading-data
          docker pull python:3.12-slim
      - name: Grade immutable queued snapshots
        if: steps.config.outputs.ready == 'true'
        env:
          SUPABASE_URL: https://lndzhmwvooqfrqcafhut.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GRADER_SHARED_DIR: challenge-bank
          GRADER_CURRICULUM: grading-data/course.json
          GRADER_CASES_DIR: challenge-grader/grader
          GRADER_VERSION: ${{ github.sha }}:68b8ce79ee03c199cd1efb47ad545b92694d9e28:75f2d50ab64bd9552aeb2008f83ad5b456c63394:69ce52fc851a91545075724c9b0290db7bf6fef6
        run: python3 grading/worker.py
